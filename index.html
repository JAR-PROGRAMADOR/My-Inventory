<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>My Inventory - Rescate</title>
<style>
body{background:#1C2128;color:#E8EAED;font-family:Arial;padding:20px}
input,button{padding:10px;margin:5px}
.panel{background:#242A32;border:1px solid #3A414C;padding:20px;margin-top:20px}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #3A414C;padding:8px;text-align:left}
.btn{background:#E8A33D;border:none;cursor:pointer;color:#000;font-weight:bold}
</style>
</head>
<body>
<h1>My Inventory - MODO RESCATE</h1>
<p>Si ves esto, el servidor YA funciona.</p>

<div class="panel">
<h3>Registro / Login (MySQL compartido)</h3>
<input id="nombre" placeholder="Nombre completo">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button class="btn" onclick="registrar()">Crear cuenta</button>
<button class="btn" onclick="login()">Entrar</button>
<div id="msg"></div>
</div>

<div class="panel">
<h3>Productos (Todos ven lo mismo)</h3>
<input id="codigo" placeholder="Codigo P-001">
<input id="pNombre" placeholder="Nombre producto">
<input id="compra" type="number" placeholder="Precio compra">
<input id="venta" type="number" placeholder="Precio venta">
<input id="stock" type="number" placeholder="Stock">
<input id="min" type="number" placeholder="Minimo" value="5">
<button class="btn" onclick="crearProd()">+ Crear producto</button>
<table><thead><tr><th>Codigo</th><th>Nombre</th><th>Stock</th><th>Accion</th></tr></thead><tbody id="tbody"></tbody></table>
</div>

<script>
const API='';
function msg(t){document.getElementById('msg').textContent=t}
async function registrar(){
  const r=await fetch(API+'/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre_completo:document.getElementById('nombre').value,usuario:document.getElementById('user').value,contrasena:document.getElementById('pass').value})});
  const d=await r.json(); msg(r.ok? 'Creado rol:'+d.rol_id : d.message);
}
async function login(){
  const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:document.getElementById('user').value,contrasena:document.getElementById('pass').value})});
  const d=await r.json(); msg(r.ok? 'Hola '+d.nombre_completo+' rol_id:'+d.rol_id : d.message);
  if(r.ok) cargar();
}
async function cargar(){
  const r=await fetch(API+'/api/productos'); const prods=await r.json();
  document.getElementById('tbody').innerHTML=prods.map(p=>`<tr><td>${p.codigo}</td><td>${p.nombre}</td><td>${p.stock}</td><td><button onclick="borrar(${p.id})">X</button></td></tr>`).join('');
}
async function crearProd(){
  await fetch(API+'/api/productos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo:document.getElementById('codigo').value,nombre:document.getElementById('pNombre').value,precio_compra:document.getElementById('compra').value,precio_venta:document.getElementById('venta').value,stock:document.getElementById('stock').value,stock_minimo:document.getElementById('min').value,categoria_id:1})});
  cargar();
}
async function borrar(id){ await fetch(API+'/api/productos/'+id,{method:'DELETE'}); cargar(); }
cargar();
</script>
</body>
</html>
